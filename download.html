<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Hidaya • Quran, Hadith & AI</title>
    <!-- Open Graph for Instagram / WhatsApp Link Preview -->
    <meta property="og:title" content="Hidaya - Quran, Hadith & AI">
    <meta property="og:description" content="Seamless faith built around your daily routine. Clean Quran, Audio, 200+ Duas & Idrak AI.">
    <meta property="og:image" content="https://syedbabarshahpk.github.io/hidaya-growth-dashboard/hidaya_profile.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #070B14;
            color: #F8FAFC;
            background-image: 
                radial-gradient(at 50% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 60%),
                radial-gradient(at 50% 100%, rgba(56, 189, 248, 0.12) 0px, transparent 60%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800/90 backdrop-blur-xl rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-6 relative overflow-hidden">
        
        <!-- App Logo & Badge -->
        <div class="relative flex flex-col items-center">
            <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-indigo-600 to-sky-400 p-[2px] shadow-xl shadow-indigo-500/25 mb-4">
                <div class="w-full h-full bg-slate-950 rounded-[22px] overflow-hidden flex items-center justify-center">
                    <img src="hidaya_profile.png" alt="Hidaya Logo" class="w-full h-full object-cover">
                </div>
            </div>
            <div class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-mono font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="detectedPlatformText">Detecting your device...</span>
            </div>
        </div>

        <!-- Headline & Value Prop -->
        <div class="space-y-2">
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Hidaya: Quran, Hadith & AI</h1>
            <p class="text-xs text-slate-300 leading-relaxed max-w-xs mx-auto">
                Seamless faith built around your routine. Idrak AI, Quran with audio recitation, and authentic Duas.
            </p>
        </div>

        <!-- Store Action Buttons -->
        <div class="space-y-3 pt-2">
            <!-- iOS App Store Button -->
            <a id="btn-apple" href="https://apps.apple.com/app/id6783264330" 
                class="w-full py-3.5 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-3 transition-all duration-200">
                <i data-lucide="apple" class="w-5 h-5 fill-current"></i>
                <div class="text-left">
                    <div class="text-[10px] font-normal leading-none opacity-80">Download on the</div>
                    <div class="text-sm font-bold leading-tight">Apple App Store</div>
                </div>
            </a>

            <!-- Google Play Button -->
            <a id="btn-google" href="https://play.google.com/store/apps/details?id=com.hidayaaitheapp.app" 
                class="w-full py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-white font-bold text-sm flex items-center justify-center space-x-3 transition-all duration-200 shadow-md">
                <i data-lucide="play" class="w-5 h-5 fill-current text-sky-400"></i>
                <div class="text-left">
                    <div class="text-[10px] font-normal leading-none text-slate-400">Get it on</div>
                    <div class="text-sm font-bold leading-tight">Google Play</div>
                </div>
            </a>
        </div>

        <!-- Trust Badges -->
        <div class="pt-4 border-t border-slate-800/80 flex items-center justify-center space-x-6 text-[11px] text-slate-400 font-mono">
            <div class="flex items-center space-x-1">
                <span class="text-amber-400 font-bold">5.0 ★</span>
                <span>Rating</span>
            </div>
            <span>•</span>
            <div>100% Free</div>
            <span>•</span>
            <div>No Ads</div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // Device Auto-Detection Logic
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isAndroid = /android/i.test(userAgent);

        const label = document.getElementById('detectedPlatformText');
        const btnApple = document.getElementById('btn-apple');
        const btnGoogle = document.getElementById('btn-google');

        const APPLE_URL = 'https://apps.apple.com/app/id6783264330';
        const GOOGLE_URL = 'https://play.google.com/store/apps/details?id=com.hidayaaitheapp.app';

        if (isIOS) {
            label.innerText = 'iPhone detected • Redirecting to App Store...';
            btnApple.className = 'w-full py-4 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base shadow-xl shadow-indigo-600/40 flex items-center justify-center space-x-3 transition-all ring-2 ring-indigo-400';
            btnGoogle.className = 'w-full py-2.5 px-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs flex items-center justify-center space-x-2';
            
            // Auto redirect after 1.5 seconds so user can see what's happening
            setTimeout(() => {
                window.location.href = APPLE_URL;
            }, 1200);
        } else if (isAndroid) {
            label.innerText = 'Android detected • Redirecting to Google Play...';
            btnGoogle.className = 'w-full py-4 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base shadow-xl shadow-indigo-600/40 flex items-center justify-center space-x-3 transition-all ring-2 ring-indigo-400';
            btnApple.className = 'w-full py-2.5 px-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs flex items-center justify-center space-x-2';

            // Auto redirect after 1.5 seconds
            setTimeout(() => {
                window.location.href = GOOGLE_URL;
            }, 1200);
        } else {
            label.innerText = 'Select your device platform';
        }
    </script>
</body>
</html>
